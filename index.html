<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multichat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            background: rgba(0, 0, 0, 0);
            background-color: rgba(0, 0, 0, 0);
            overflow: hidden;
            height: 100vh;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #efeff1;
            display: flex;
            flex-direction: column;
        }

        #titlebar {
            height: 28px;
            background: rgba(24, 24, 27, 0.75);
            -webkit-app-region: drag;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(47, 47, 53, 0.6);
        }

        #titlebar .title {
            font-size: 12px;
            font-weight: 600;
            color: #b9b9c0;
            user-select: none;
        }

        #titlebar .controls {
            display: flex;
            gap: 4px;
            -webkit-app-region: no-drag;
        }

        #titlebar button {
            background: transparent;
            border: none;
            color: #b9b9c0;
            cursor: pointer;
            font-size: 14px;
            width: 22px;
            height: 22px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #titlebar button:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        #titlebar button.close:hover {
            background: #e81123;
            color: #fff;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(14, 14, 16, 0.55);
            border-radius: 8px;
            margin: 6px;
        }

        #chat-container::-webkit-scrollbar { width: 6px; }
        #chat-container::-webkit-scrollbar-thumb {
            background: rgba(47, 47, 53, 0.8);
            border-radius: 3px;
        }
        #chat-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .message {
            padding: 4px 6px;
            border-radius: 6px;
            line-height: 1.4;
            font-size: 14px;
            word-wrap: break-word;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            animation: fadeIn 0.2s ease;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.9);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .platform-logo {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }

        /* Баджи Twitch */
        .badges {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            flex-shrink: 0;
        }

        .twitch-badge {
            width: 18px;
            height: 18px;
            vertical-align: middle;
        }

        /* Смайлики и эмодзи */
        .chat-emote {
            width: 24px;
            height: 24px;
            vertical-align: middle;
            margin: 0 1px;
        }

        .message .username {
            font-weight: 700;
            margin-right: 2px;
        }

        .message .text {
            color: #efeff1;
            display: inline;
            word-break: break-word;
        }

        .system-message {
            text-align: center;
            color: #6b6b75;
            font-size: 12px;
            padding: 12px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div id="titlebar">
        <span class="title">Multichat</span>
        <div class="controls">
            <button id="btn-min" title="Свернуть">–</button>
            <button id="btn-close" class="close" title="Закрыть">×</button>
        </div>
    </div>

    <div id="chat-container">
        <div class="system-message">Ожидание сообщений...</div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
