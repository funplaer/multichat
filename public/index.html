<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multichat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0e0e10;
            color: #efeff1;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #18181b;
            padding: 16px 20px;
            border-bottom: 1px solid #2f2f35;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        header h1 {
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        #chat-container::-webkit-scrollbar { width: 6px; }
        #chat-container::-webkit-scrollbar-thumb {
            background: #2f2f35;
            border-radius: 3px;
        }

        .message {
            padding: 6px 10px;
            border-radius: 6px;
            line-height: 1.5;
            font-size: 14px;
            word-wrap: break-word;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .platform-logo {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }

        .message .username {
            font-weight: 700;
            margin-right: 2px;
        }

        .message .text { color: #efeff1; }

        .system-message {
            text-align: center;
            color: #6b6b75;
            font-size: 12px;
            padding: 12px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <header>
        <h1>💬 Multichat</h1>
    </header>

    <div id="chat-container">
        <div class="system-message">Ожидание сообщений...</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const chatContainer = document.getElementById('chat-container');
        let systemMessageRemoved = false;

        const LOGOS = {
            twitch: `
                <svg class="platform-logo" style="color:#9147ff" viewBox="0 0 2400 2800" xmlns="http://www.w3.org/2000/svg" fill="currentColor" aria-hidden="true">
                    <path d="M2200 1300l-400 400h-400l-350 350v-350H600V200h1600v1100zM500 0L0 500v1800h600v500l500-500h400l900-900V0H500zm1300 550h200v600h-200V550zm-550 0h200v600h-200V550z"/>
                </svg>
            `,
            youtube: `
                <svg class="platform-logo" style="color:#ff0000" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor" aria-hidden="true">
                    <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                </svg>
            `
        };

        socket.on('system-message', (data) => {
            console.log('Системное сообщение:', data.text);
        });

        socket.on('chat-message', (data) => {
            if (!systemMessageRemoved) {
                const sysMsg = chatContainer.querySelector('.system-message');
                if (sysMsg) sysMsg.remove();
                systemMessageRemoved = true;
            }

            const messageEl = document.createElement('div');
            messageEl.className = 'message';

            const logoWrap = document.createElement('span');
            logoWrap.innerHTML = LOGOS[data.platform] || LOGOS.twitch;

            const usernameEl = document.createElement('span');
            usernameEl.className = 'username';
            usernameEl.style.color = data.color;
            usernameEl.textContent = data.username + ':';

            const textEl = document.createElement('span');
            textEl.className = 'text';
            textEl.textContent = data.message || '';

            messageEl.appendChild(logoWrap.firstElementChild);
            messageEl.appendChild(usernameEl);
            messageEl.appendChild(textEl);
            chatContainer.appendChild(messageEl);

            chatContainer.scrollTop = chatContainer.scrollHeight;

            const messages = chatContainer.querySelectorAll('.message');
            if (messages.length > 200) messages[0].remove();
        });
    </script>
</body>
</html>
